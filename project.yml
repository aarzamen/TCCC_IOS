name: TCCC_IOS
options:
  bundleIdPrefix: com.aarzamen
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
# Signing identity never appears as a literal in this public repository. The
# tracked Config/Signing.xcconfig holds no identity; it optionally includes the
# ignored Config/Signing.local.xcconfig, where DEVELOPMENT_TEAM is set (copy
# Config/Signing.local.xcconfig.example). Xcode requires the referenced base
# configuration file to exist, so the tracked file is the reference.
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
packages:
  TCCCKit:
    path: Packages/TCCCKit
  # 2026-05-05 night-pass B1: Parakeet ASR alt-fallback. Apache 2.0.
  # Linked unconditionally; the Settings toggle decides whether to
  # actually instantiate ParakeetTranscriptStream at runtime.
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio.git
    exactVersion: "0.14.4"
  # 2026-05-05 LLM-backends L1: AnyLanguageModel wraps mlx-swift-lm
  # behind a LanguageModelSession-shaped API. AnyLanguageModel uses
  # Swift 6.1 package traits to gate the heavy MLX dep; Xcode itself
  # cannot declare trait-enabled package deps yet (XcodeGen issue
  # #1585, AnyLanguageModel README "Using Traits in Xcode Projects").
  # The documented workaround is a local SPM shim package whose
  # Package.swift requests `traits: ["MLX"]` and re-exports the
  # AnyLanguageModel module — that's TCCCLLM at Packages/TCCCLLM.
  TCCCLLM:
    path: Packages/TCCCLLM
  # 2026-05-10 Granite Speech Foundation Sprint 1 (v3 §G0): TCCCAudio
  # is a local SPM shim wrapping Blaizzy/mlx-audio-swift. Heavy MLX
  # audio deps (mlx-swift, mlx-swift-lm, swift-transformers,
  # swift-huggingface) live behind this shim, not in TCCCKit (pure
  # logic) and not in the app target (AGENTS.md "no logic in app
  # target"). Mirrors TCCCLLM pattern. Pinned to v0.1.2 commit SHA in
  # Packages/TCCCAudio/Package.swift.
  TCCCAudio:
    path: Packages/TCCCAudio
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    # Xcode 15 user-script sandboxing blocks the git reads the build-stamp
    # post-build script needs (.git/HEAD, refs, index). Offline local
    # project; scripts are ours; determinism > sandbox here.
    ENABLE_USER_SCRIPT_SANDBOXING: NO
  configs:
    Release:
      TCCC_REQUIRE_OFFLINE_MODELS: YES
targets:
  TCCC_IOS:
    type: application
    platform: iOS
    sources:
      - path: TCCC_IOS
    info:
      path: TCCC_IOS/Generated/Info.plist
      properties:
        CFBundleDisplayName: "Swift TCCC"
        CFBundleShortVersionString: "1.0"
        # Placeholder: the post-build stamp below sets CFBundleVersion to the
        # commit count, so two installs of different commits differ in build
        # number, not only in SHA. CFBundleShortVersionString stays the release.
        CFBundleVersion: "1"
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen:
          UIColorName: ""
          UIImageName: ""
        UIRequiredDeviceCapabilities:
          - arm64
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations~iphone:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - audio
          - bluetooth-central
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSMicrophoneUsageDescription: "Microphone access is required for offline voice intake of medic narration during casualty documentation. Audio never leaves the device."
        NSBluetoothAlwaysUsageDescription: "Connect locally to your pulse oximeter. Readings are recorded only after you associate the sensor with the current casualty. No internet or vendor account is required."
        NSSpeechRecognitionUsageDescription: "Speech recognition runs entirely on-device to transcribe medic narration into the casualty record. Transcription never leaves the device."
        NSLocationWhenInUseUsageDescription: "Use this iPhone's location to populate the MEDEVAC Line 1 MGRS grid. Location stays on this device unless the operator manually exports the casualty record."
        NSPhotoLibraryAddUsageDescription: "Save the offline QR code of the encounter to Photos so you can scan it from another device when no wired handoff is available."
    dependencies:
      - package: TCCCKit
        product: TCCCDomain
      - package: TCCCKit
        product: TCCCExtractor
      - package: TCCCKit
        product: TCCCReports
      - package: TCCCKit
        product: TCCCDesign
      - package: TCCCKit
        product: TCCCBench
      - package: FluidAudio
        product: FluidAudio
      - package: TCCCLLM
        product: TCCCLLM
      - package: TCCCAudio
        product: TCCCAudio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aarzamen.TCCCai
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: TCCC_IOS/TCCC_IOS.entitlements
    preBuildScripts:
      - name: "Embed verified offline models"
        basedOnDependencyAnalysis: false
        shell: /bin/bash
        script: bash "$SRCROOT/tools/embed_offline_models.sh"
    postBuildScripts:
      - name: "Stamp build identity"
        basedOnDependencyAnalysis: false
        # Declaring the processed Info.plist as an input orders this script after
        # ProcessInfoPlistFile; without it Xcode 26 could run it first, find no
        # plist, and ship an unstamped app.
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
        shell: /bin/bash
        script: |
          set -euo pipefail
          PLIST="${TARGET_BUILD_DIR}/${INFOPLIST_PATH}"
          if [ ! -f "$PLIST" ]; then echo "warning: build stamp skipped, no Info.plist at $PLIST"; exit 0; fi
          GIT_SHA=$(git -C "${SRCROOT}" rev-parse --short HEAD 2>/dev/null || echo unknown)
          GIT_BRANCH=$(git -C "${SRCROOT}" rev-parse --abbrev-ref HEAD 2>/dev/null || echo unknown)
          if [ -n "$(git -C "${SRCROOT}" status --porcelain 2>/dev/null)" ]; then GIT_SHA="${GIT_SHA}+"; fi
          BUILD_DATE=$(date "+%Y-%m-%d %H:%M")
          # Build number = commits reachable from HEAD (monotonic per branch);
          # falls back to the build minute when git is unavailable.
          BUILD_NUMBER=$(git -C "${SRCROOT}" rev-list --count HEAD 2>/dev/null || date "+%Y%m%d%H%M")
          for KEY in TCCCGitSHA TCCCGitBranch TCCCBuildDate; do
            /usr/libexec/PlistBuddy -c "Delete :${KEY}" "$PLIST" 2>/dev/null || true
          done
          /usr/libexec/PlistBuddy -c "Add :TCCCGitSHA string ${GIT_SHA}" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :TCCCGitBranch string ${GIT_BRANCH}" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :TCCCBuildDate string ${BUILD_DATE}" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${BUILD_NUMBER}" "$PLIST" \
            || /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string ${BUILD_NUMBER}" "$PLIST"
  TCCC_IOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TCCC_IOSTests
    dependencies:
      - target: TCCC_IOS
      - package: TCCCKit
        product: TCCCDomain
      - package: TCCCKit
        product: TCCCExtractor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aarzamen.TCCCaiTests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/TCCC_IOS.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/TCCC_IOS"
        BUNDLE_LOADER: "$(TEST_HOST)"
        GENERATE_INFOPLIST_FILE: YES
